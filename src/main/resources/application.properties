spring.application.name=usuario

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/microservice-usuario}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:}
broker.queue.email.name=${RABBITMQ_EMAIL_QUEUE:}

management.endpoints.web.exposure.include=health,metrics,swagger-ui
management.endpoint.health.show-details=always
management.metrics.enable.all=true

springdoc.show-actuator=true
